<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SENAI - Carregando</title>
<style>
  :root{
    --red: #E30613;
    --red-glow: #ff2a2a;
    --gray: #b9b9b9;
    --dark: #1a1a1a;
  }

  html,body{
    margin:0;
    height:100%;
    background:#000000;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow:hidden;
  }

  .screen{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000000;
  }

  /* corner decorations */
  .corner{
    position:absolute;
    width:340px;
    height:340px;
    pointer-events:none;
  }
  .corner.tl{ top:0; left:0; }
  .corner.br{ bottom:0; right:0; transform:rotate(180deg); }

  .stripe{
    position:absolute;
    top:-40px; left:-160px;
    width:520px; height:60px;
    background:linear-gradient(90deg,#7a0509,var(--red));
    transform:rotate(-42deg);
  }
  .stripe.s2{
    top:20px; left:-190px;
    width:520px; height:8px;
    background:var(--red);
    opacity:.85;
  }
  .dots-grid{
    position:absolute;
    top:60px; left:260px;
    display:grid;
    grid-template-columns:repeat(6,10px);
    grid-template-rows:repeat(6,10px);
    gap:16px;
  }
  .dots-grid span{
    width:4px;height:4px;border-radius:50%;
    background:#8a8a8a;
    opacity:.55;
  }

  /* loader core */
  .loader-wrap{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }

  .ring-box{
    position:relative;
    width:340px;
    height:340px;
  }

  .ring-box svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .ring-red{
    transform-origin:170px 170px;
    animation: spin 2.6s linear infinite;
    filter: drop-shadow(0 0 6px var(--red-glow));
  }
  .ring-gray{
    transform-origin:170px 170px;
    animation: spin-rev 3.6s linear infinite;
    opacity:.55;
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes spin-rev{ to{ transform:rotate(-360deg); } }

  .logo-badge{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }

  .logo-plate{
    background:var(--red);
    padding:10px 26px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 0 22px rgba(227,6,19,.55);
  }
  .ticks{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .ticks span{
    display:block;
    width:14px;height:2px;
    background:rgba(255,255,255,.6);
  }
  .logo-text{
    color:#fff;
    font-weight:800;
    font-style:italic;
    font-size:34px;
    letter-spacing:1px;
  }
  .tagline{
    color:#c9c9c9;
    font-size:11px;
    letter-spacing:3px;
    font-weight:600;
  }

  .loading-label{
    color:#d5d5d5;
    font-size:14px;
    letter-spacing:6px;
    font-weight:600;
  }
  .loading-label::after{
    content:'';
    display:inline-block;
    width:1ch;
    animation: dots 1.4s steps(4,end) infinite;
  }
  @keyframes dots{
    0%{ content:''; }
  }

  .bar-track{
    width:340px;
    height:18px;
    border-radius:10px;
    background:#2a2a2a;
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.5);
  }
  .bar-fill{
    height:100%;
    width:0%;
    border-radius:10px;
    background:repeating-linear-gradient(
      45deg,
      var(--red) 0 14px,
      #ff4444 14px 28px
    );
    box-shadow:0 0 12px var(--red-glow);
    animation: fill 3.2s ease-in-out infinite;
  }
  @keyframes fill{
    0%{ width:4%; }
    70%{ width:96%; }
    100%{ width:100%; }
  }

  .step-dots{
    display:flex;
    gap:10px;
  }
  .step-dots span{
    width:9px;height:9px;border-radius:50%;
    background:var(--red);
    opacity:.25;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .step-dots span:nth-child(1){ animation-delay:0s; }
  .step-dots span:nth-child(2){ animation-delay:.15s; }
  .step-dots span:nth-child(3){ animation-delay:.3s; }
  .step-dots span:nth-child(4){ animation-delay:.45s; }
  .step-dots span:nth-child(5){ animation-delay:.6s; }

  @keyframes pulse{
    0%,100%{ opacity:.2; transform:scale(.85); }
    50%{ opacity:1; transform:scale(1.1); }
  }
</style>
</head>
<body>

<div class="screen">

  <div class="corner tl">
    <div class="stripe"></div>
    <div class="stripe s2"></div>
    <div class="dots-grid">
      <script>document.write('<span></span>'.repeat(36));</script>
    </div>
  </div>

  <div class="corner br">
    <div class="stripe"></div>
    <div class="stripe s2"></div>
    <div class="dots-grid">
      <script>document.write('<span></span>'.repeat(36));</script>
    </div>
  </div>

  <div class="loader-wrap">

    <div class="ring-box">
      <svg viewBox="0 0 340 340">
        <g class="ring-gray" fill="none" stroke="var(--gray)" stroke-width="6" stroke-linecap="round">
          <path d="M 60 100 A 130 130 0 0 1 110 55" />
          <path d="M 230 55 A 130 130 0 0 1 280 100" />
          <path d="M 60 240 A 130 130 0 0 1 110 285" />
          <path d="M 230 285 A 130 130 0 0 1 280 240" />
        </g>
        <g class="ring-red" fill="none" stroke="var(--red)" stroke-width="10" stroke-linecap="round">
          <path d="M 45 130 A 125 125 0 0 1 95 50" />
          <path d="M 245 50 A 125 125 0 0 1 295 130" />
          <path d="M 45 210 A 125 125 0 0 1 95 290" />
          <path d="M 245 290 A 125 125 0 0 1 295 210" />
        </g>
      </svg>

      <div class="logo-badge">
        <div class="logo-plate">
          <div class="ticks"><span></span><span></span><span></span></div>
          <div class="logo-text">SENAI</div>
          <div class="ticks"><span></span><span></span><span></span></div>
        </div>
        <div class="tagline">CONECTANDO VOCÊ AO SEU DESTINO</div>
      </div>
    </div>

    <div class="loading-label">CARREGANDO</div>

    <div class="bar-track">
      <div class="bar-fill"></div>
    </div>

    <div class="step-dots">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

  </div>

</div>

</body>
</html>
